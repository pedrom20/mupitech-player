name: Docker Image Build

on:
  push:
    branches:
      - mupitech-custom
    paths:
      - '**'
      - '!.editorconfig'
      - '!website/**'
      - '!.github/workflows/deploy-website.yaml'
      - '!.github/workflows/build-balena-disk-image.yaml'
      - '!.github/workflows/python-lint.yaml'
      - '!.github/workflows/generate-openapi-schema.yml'
      - '!.github/workflows/docker-test.yml'
      - '!.github/pull_request_template.md'
      - '!.github/dependabot.yml'
      - '!.github/release.yml'
      - '!CONTRIBUTING.md'
      - '!README.md'
      - '!docs/**'
      - '!bin/install.sh'
      - '!bin/upgrade_containers.sh'
      - '!bin/start_development_server.sh'
      - '!tests/**'
      - '!docker/Dockerfile.dev'
      - '!.cursor/**'
      - '!.claude/**'
      - '!src/anthias_host_agent/**'
      # rpi-imager generator and the bun installer script don't
      # affect the container image build; skip docker-build runs that
      # only touch them.
      - '!tools/raspberry_pi_imager/**'
      - '!.github/workflows/scripts/install-bun.sh'
  workflow_dispatch:

jobs:
  run-tests:
    uses: ./.github/workflows/docker-test.yaml

  buildx:
    needs: run-tests
    # Scoped per-job (not at workflow level) so `run-tests` and any
    # future read-only job don't inherit `packages: write`. `buildx`
    # needs it so `docker login ghcr.io` with GITHUB_TOKEN can push
    # both ghcr.io/pedrom20/mupitech-player-* image tags and the
    # `buildcache-*` registry cache tags written by --cache-backend=
    # registry. `contents: read` is the implicit default but pinned
    # explicitly so a future workflow edit can't silently lose
    # checkout access. `id-token: write` + `attestations: write` let
    # the keyless build-provenance step below mint Sigstore-backed
    # attestations for the pushed images (same OIDC model the SBOM
    # workflow already uses).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      # Don't cancel sibling jobs on the first failure: any platform that
      # has already finished building its images will have pushed the
      # immutable <short-hash>-<board> tags, which are harmless on their
      # own. Only the publish-latest job below — gated on the entire
      # matrix succeeding — moves the floating latest-* tag, so a partial
      # failure leaves users on the previous coherent latest-* set
      # instead of a half-pushed mix of old + new images.
      #
      # The matrix is intentionally only on `board`, not `(board, service)`:
      # buildkit's per-runner cache hashes apt-get-update output (timestamps
      # in /var/lib/apt/lists/*, mirror selection) into the layer digest,
      # so the same package list installed on two different runners
      # produces two different layer hashes. Building all services for
      # one board on a single runner means the base apt layer is hashed
      # once and shared across server / viewer / test / etc. — which is
      # what makes Dockerfile.base.j2's include-shared layer actually
      # dedup at the registry level. See refactor: drop celery image.
      fail-fast: false
      matrix:
        # MupiTech fork: x86 validated first (Phases 0-4); Pi5 and
        # Pi4-64 added here for Phase 5. Both are already first-class
        # upstream Anthias build targets (see
        # tools/image_builder/constants.py), so this is mostly "turn
        # the matrix back on" rather than new build-system work — our
        # MupiTech additions (v4l-utils, grim) are already board-aware:
        # grim only installs on the cage/Wayland boards (x86, arm64,
        # pi5 — see get_viewer_context in tools/image_builder/utils.py).
        # pi4-64 captures screenshots via ffmpeg kmsgrab instead (ffmpeg
        # is already a shared base dependency on every board) — see
        # anthias_viewer/mupitech_screenshot_eglfs.py.
        board: ['x86', 'pi5', 'pi4-64']
        python-version: ["3.13"]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.9.17'

      - name: Install dependencies
        run: |
          uv venv
          uv pip install --group docker-image-builder

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Create and use dedicated builder
        run: |
          docker buildx create --use --name multiarch-builder
          docker buildx inspect --bootstrap

      - name: Login to GitHub Container Registry
        if: success() && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Containers
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
          # On push events (mupitech-custom): use BuildKit's registry
          # cache backend — pushes cache to
          # ghcr.io/pedrom20/mupitech-player-<service>:buildcache-<board>
          # so subsequent push runs of the same board can pull cached
          # layers without re-installing ~825 MB of apt packages from
          # scratch.
          #
          # On workflow_dispatch (manual runs on any branch): fall
          # through to `local` mode — a per-runner ephemeral
          # directory, so effectively no-cache. workflow_dispatch
          # also skips the `docker login ghcr.io` step above (it's
          # gated on `event_name == 'push'`), so registry cache
          # would have no auth to write with anyway. This workflow
          # has no `pull_request` trigger; PRs never run this job.
          BUILDX_CACHE_BACKEND: ${{ github.event_name == 'push' && 'registry' || 'local' }}
        run: |
          uv run python -m tools.image_builder \
            --build-target=${{ matrix.board }} \
            --service=server \
            --service=viewer \
            --service=redis \
            ${{ github.event_name == 'push' && '--push --skip-latest-tag' || '' }}

      # Sign the freshly-pushed images with keyless build-provenance
      # attestations (Sigstore via GitHub OIDC — the same mechanism the
      # SBOM workflow already uses). Done here, per board, because this
      # is where the immutable <short-hash>-<board> images are pushed
      # and their digests are known. The floating latest-<board> tags
      # added later by publish-latest re-point at these same manifests
      # (identical digest), so they inherit the attestation for free.
      - name: Resolve pushed image digests
        if: success() && github.event_name == 'push'
        id: digests
        run: |
          set -euo pipefail
          short_hash="$(git rev-parse --short=7 HEAD)"
          for service in server viewer redis; do
            ref="ghcr.io/pedrom20/mupitech-player-${service}:${short_hash}-${{ matrix.board }}"
            digest="$(docker buildx imagetools inspect "${ref}" \
              --format '{{ .Manifest.Digest }}')"
            echo "${service}=${digest}" >> "${GITHUB_OUTPUT}"
            echo "Resolved ${ref} -> ${digest}"
          done

      - name: Attest anthias-server provenance (GHCR)
        if: success() && github.event_name == 'push'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/pedrom20/mupitech-player-server
          subject-digest: ${{ steps.digests.outputs.server }}
          push-to-registry: true

      - name: Attest anthias-viewer provenance (GHCR)
        if: success() && github.event_name == 'push'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/pedrom20/mupitech-player-viewer
          subject-digest: ${{ steps.digests.outputs.viewer }}
          push-to-registry: true

      - name: Attest anthias-redis provenance (GHCR)
        if: success() && github.event_name == 'push'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/pedrom20/mupitech-player-redis
          subject-digest: ${{ steps.digests.outputs.redis }}
          push-to-registry: true

  # Mirror the immutable <short-hash>-<board> tags pushed by the buildx
  # matrix onto the floating latest-<board> tag. Runs only after every
  # buildx job has succeeded, so latest-* is never advanced from a
  # half-pushed build matrix.
  #
  # Deliberately a single sequential job (no matrix): retags run inside
  # one `set -euo pipefail` block, so a transient registry error stops
  # further retags rather than racing other parallel runners that would
  # blindly continue to advance latest-* on their slice. A preflight
  # checks every <short-hash>-<board> tag is resolvable before any
  # retag fires, so a missing source tag fails the job before it
  # mutates the registry. `imagetools create` re-points the registry
  # tag to the existing manifest without re-uploading layers, and each
  # call is wrapped in 5-attempt exponential backoff so a transient
  # 429 / 5xx doesn't strand latest-* half-mirrored.
  #
  # MupiTech fork: GHCR only (ghcr.io/pedrom20/mupitech-player-*), no
  # Docker Hub mirror — that dual-registry migration was Screenly's own
  # concern, not relevant to a private fleet. Auth via the
  # workflow-issued GITHUB_TOKEN with `packages: write`.
  publish-latest:
    needs: buildx
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # See `buildx.permissions` above for rationale; same scoping reason.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror short-hash tags to latest-<board> (GHCR)
        env:
          NAMESPACE: ghcr.io/pedrom20/mupitech-player
          BOARDS: x86 pi5 pi4-64
        run: bash .github/workflows/scripts/mirror-latest-tags.sh
