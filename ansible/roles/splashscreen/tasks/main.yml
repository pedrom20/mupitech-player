---
- name: Remove deprecated splash assets
  ansible.builtin.file:
    state: absent
    path: "{{ item }}"
  with_items:
    - /etc/splashscreen.jpg
    - /etc/splashscreen.png
    - /etc/init.d/asplashscreen

- name: Check if asplashscreen rc script is registered
  ansible.builtin.stat:
    path: /etc/rcS.d/S01asplashscreen
  register: splashscreen_asplashscreen_stat

- name: Disable asplashscreen
  ansible.builtin.command: update-rc.d asplashscreen remove
  when: splashscreen_asplashscreen_stat.stat.exists
  changed_when: splashscreen_asplashscreen_stat.stat.exists

- name: Install Plymouth packages
  ansible.builtin.apt:
    name:
      - plymouth
      - plymouth-themes
      - plymouth-label

- name: Remove old Plymouth themes (upstream Screenly + our own former Anthias-named theme)
  ansible.builtin.file:
    state: absent
    path: "{{ item }}"
    owner: root
    group: root
  with_items:
    - /usr/share/plymouth/themes/screenly/
    - /usr/share/plymouth/themes/anthias/

- name: Install plymouth theme files
  ansible.builtin.copy:
    src: mupitech/
    dest: /usr/share/plymouth/themes/mupitech/
    mode: "0644"
    owner: root
    group: root
  notify: Regenerate initramfs

- name: Get current plymouth theme
  ansible.builtin.command: plymouth-set-default-theme
  register: splashscreen_plymouth_theme
  changed_when: false

# Deliberately NOT `-R`: that rebuilds the initramfs here, before the
# config below is written, so the initramfs would embed the *old*
# plymouthd.conf. plymouthd runs from the initramfs and reads its theme
# and DeviceTimeout from the copy baked in there, so the rebuild has to
# happen after every file this role installs — see the handler.
- name: Set Plymouth default theme to MupiTech
  ansible.builtin.command: plymouth-set-default-theme mupitech
  changed_when: splashscreen_plymouth_theme.stdout != "mupitech"
  notify: Regenerate initramfs

- name: Install plymouthd defaults
  ansible.builtin.copy:
    src: plymouthd.default
    dest: /usr/share/plymouth/plymouthd.defaults
    mode: "0644"
    owner: root
    group: root
  notify: Regenerate initramfs

- name: Install plymouthd.conf
  ansible.builtin.copy:
    src: plymouthd.default
    dest: /etc/plymouth/plymouthd.conf
    mode: "0644"
    owner: root
    group: root
  notify: Regenerate initramfs
