  <circle cx="49" cy="54" r="1.6" fill="#FFE72D"/>
  <rect x="41" y="60" width="8" height="1.8" rx="0.9" fill="#FFE72D" transform="rotate(-12 45 61)"/>
  <rect x="43" y="69" width="4" height="9" fill="#FDED3A"/>
  <rect x="35" y="78" width="20" height="5" rx="2.5" fill="#FDED3A"/>
